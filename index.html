<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paradox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, sans-serif;
            background: #111;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome {
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .enter-button {
            display: inline-block;
            padding: 14px 50px;

            background: white;
            color: #111;

            text-decoration: none;
            border-radius: 8px;

            font-size: 18px;
            font-weight: bold;

            transition: 0.2s;
        }

        .enter-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="welcome">

        <h1>Paradox</h1>

        <p>
            به پارادوکس خوش آمدید
        </p>

        <a href="main.html" class="enter-button">
            ورود به سایت
        </a>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paradox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: #101010;
            color: white;
        }

        /* نوار بالای سایت */

        header {
            height: 70px;
            background: #181818;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            border-bottom: 1px solid #292929;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            margin-right: 25px;
            transition: 0.2s;
        }

        nav a:hover {
            color: white;
        }

        /* بخش اصلی */

        .container {
            width: 90%;
            max-width: 1100px;

            margin: 50px auto;
        }

        .title {
            font-size: 30px;
            margin-bottom: 30px;
        }

        /* کارت متن */

        .posts {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 25px;
        }

        .post {
            background: #181818;

            border: 1px solid #292929;

            border-radius: 12px;

            overflow: hidden;

            transition: 0.2s;
        }

        .post:hover {
            transform: translateY(-5px);
        }

        .post-image {
            width: 100%;
            height: 180px;

            background: #252525;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #777;
        }

        .post-content {
            padding: 20px;
        }

        .post-content h2 {
            margin-top: 0;
            font-size: 21px;
        }

        .post-content p {
            color: #aaa;
            line-height: 1.8;
        }

        .read-more {
            display: inline-block;

            margin-top: 10px;

            color: white;

            text-decoration: none;

            font-size: 14px;
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        Paradox
    </div>

    <nav>
        <a href="main.html">خانه</a>
        <a href="#">درباره</a>
        <a href="#">ورود نویسندگان</a>
    </nav>

</header>


<main class="container">

    <h1 class="title">
        نوشته‌های تازه
    </h1>


    <section class="posts">


        <!-- متن نمونه -->

        <article class="post">

            <div class="post-image">
                تصویر
            </div>

            <div class="post-content">

                <h2>
                    اولین نوشته Paradox
                </h2>

                <p>
                    اینجا نوشته‌های منتشرشده
                    در سایت نمایش داده خواهند شد.
                </p>

                <a href="#" class="read-more">
                    ادامه نوشته ←
                </a>

            </div>

        </article>


        <!-- متن نمونه دوم -->

        <article class="post">

            <div class="post-image">
                تصویر
            </div>

            <div class="post-content">

                <h2>
                    یک نوشته دیگر
                </h2>

                <p>
                    بعداً این قسمت به پایگاه داده
                    وصل می‌شود.
                </p>

                <a href="#" class="read-more">
                    ادامه نوشته ←
                </a>

            </div>

        </article>


    </section>

</main>

</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Paradox</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background: #101010;

            color: white;

            font-family: Tahoma, sans-serif;

        }

        header {

            height: 70px;

            background: #181818;

            border-bottom: 1px solid #292929;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 40px;

        }

        .logo {

            font-size: 25px;

            font-weight: bold;

            letter-spacing: 2px;

        }

        nav a {

            color: #ccc;

            text-decoration: none;

            margin-right: 25px;

        }

        nav a:hover {

            color: white;

        }

        .container {

            width: 90%;

            max-width: 1100px;

            margin: 50px auto;

        }

        .title {

            font-size: 30px;

            margin-bottom: 30px;

        }

        .posts {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 25px;

        }

        .post {

            background: #181818;

            border: 1px solid #292929;

            border-radius: 12px;

            overflow: hidden;

            transition: 0.2s;

        }

        .post:hover {

            transform: translateY(-5px);

        }

        .post-image {

            width: 100%;

            height: 180px;

            background: #252525;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #777;

            overflow: hidden;

        }

        .post-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }

        .post-content {

            padding: 20px;

        }

        .post-content h2 {

            margin-top: 0;

            font-size: 21px;

        }

        .post-content p {

            color: #aaa;

            line-height: 1.8;

        }

        .read-more {

            display: inline-block;

            margin-top: 10px;

            color: white;

            text-decoration: none;

        }

        .message {

            color: #888;

            text-align: center;

            padding: 40px 0;

        }

    </style>

</head>

<body>


<header>

    <div class="logo">
        Paradox
    </div>

    <nav>

        <a href="main.html">
            خانه
        </a>

        <a href="login.html">
            ورود نویسندگان
        </a>

    </nav>

</header>


<main class="container">

    <h1 class="title">
        نوشته‌های تازه
    </h1>

    <div id="posts"
         class="posts">

        <div class="message">
            در حال دریافت نوشته‌ها...
        </div>

    </div>

</main>


<script>

const SUPABASE_URL =
    "https://ordoglrqdizeisyoupsf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_CxL8uf4ajAFpbyCTGpXz3Q_bk23Up5W";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function loadPosts() {

    const container =
        document.getElementById("posts");


    const {
        data,
        error
    } = await supabaseClient

        .from("posts")

        .select(
            "id,title,content,image_url,created_at"
        )

        .eq(
            "status",
            "published"
        )

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="message">
                دریافت نوشته‌ها با خطا روبه‌رو شد.
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="message">
                هنوز نوشته‌ای منتشر نشده است.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    data.forEach(post => {

        const article =
            document.createElement("article");


        article.className =
            "post";


        let imageHTML = `
            <div class="post-image">
                بدون تصویر
            </div>
        `;


        /*
         فعلاً اگر تصویر خصوصی باشد،
         اینجا تصویر نمایش داده نمی‌شود.
         در مرحله بعد لینک موقت می‌سازیم.
        */


        article.innerHTML = `

            ${imageHTML}

            <div class="post-content">

                <h2>
                    ${escapeHtml(post.title)}
                </h2>

                <p>
                    ${escapeHtml(
                        post.content.substring(0, 180)
                    )}
                    ...
                </p>

                <a
                    class="read-more"
                    href="post.html?id=${post.id}">

                    ادامه نوشته ←

                </a>

            </div>
        `;


        container.appendChild(article);

    });

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


loadPosts();

</script>

</body>

</html>
